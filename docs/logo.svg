<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f1f"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#171331"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset="0.45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="36" fill="url(#bg)"/>

  <!-- chip -->
  <g transform="translate(200 200)">
    <circle r="170" fill="url(#glow)"/>
    <g stroke="#7c6bd6" stroke-width="7" stroke-linecap="round">
      <path d="M-66 -112v-26M-22 -112v-26M22 -112v-26M66 -112v-26"/>
      <path d="M-66 112v26M-22 112v26M22 112v26M66 112v26"/>
      <path d="M-112 -66h-26M-112 -22h-26M-112 22h-26M-112 66h-26"/>
      <path d="M112 -66h26M112 -22h26M112 22h26M112 66h26"/>
    </g>
    <rect x="-112" y="-112" width="224" height="224" rx="30" fill="url(#die)" stroke="#8b7cf0" stroke-width="5"/>
    <rect x="-84" y="-84" width="168" height="168" rx="18" fill="none" stroke="#4b3f8f" stroke-width="3"/>
    <!-- bolt -->
    <path d="M18 -132 L-58 14 L-6 14 L-30 132 L62 -24 L8 -24 Z" fill="#ffd23f" filter="url(#soft)" opacity="0.8"/>
    <path d="M18 -132 L-58 14 L-6 14 L-30 132 L62 -24 L8 -24 Z" fill="url(#bolt)" stroke="#fff3b0" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="410" y="215" font-size="132" font-weight="700" fill="#f4f1ff" letter-spacing="2">saetta</text>
    <text x="414" y="282" font-size="44" font-weight="400" letter-spacing="10">
      <tspan fill="#9aa0c8">mac</tspan><tspan fill="#a78bfa" font-weight="700">qwen</tspan>
    </text>
    <text x="416" y="330" font-size="22" fill="#6f7299" letter-spacing="3">Qwen3.6 on Apple Silicon, in Rust and Metal</text>
  </g>
</svg>
